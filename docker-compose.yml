

services:
  # Backend del Proyecto Quipus
  quipus-backend:
    build: .
    container_name: quipus-backend
    ports:
      - "${PORT:-3001}:3001"
    env_file:
      - ./.env
    environment:
      - NODE_ENV=development
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped
    networks:
      - quipus-network

  # Frontend del Proyecto Quipus (opcional, si quieres contenerizarlo también)
