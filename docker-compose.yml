    #  volumes:
    #    - ./frontend:/app
    #    - /app/node_modules
   #   restart: unless-stopped
   #   networks:

      #  - quipus-network
   #   depends_on:
    #   - quipus-backend

networks:
  quipus-network:
    driver: bridge

# Volúmenes para persistencia
volumes:
  backend_node_modules:
  frontend_node_modules:
